name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest
      - name: Tests
        run: python -m pytest -q
      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SMBCheck app.py
          python -m PyInstaller --noconfirm --onefile --console --name SMBCheck-cli app.py
      - name: Smoke test CLI
        run: dist\SMBCheck-cli.exe demo
      - uses: actions/upload-artifact@v4
        with:
          name: SMBCheck-windows
          path: dist/*.exe
